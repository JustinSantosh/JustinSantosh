<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="SIDE B: deep cuts ↓"><title>SIDE B: deep cuts ↓</title><defs><filter id="grain" x="0" y="0" width="100%" height="100%">
