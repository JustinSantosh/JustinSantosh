# Generates the contribution-snake animation and pushes it to the `output` branch.
name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7a1f2b&color_dots=#ebe5d6,#f1d9a0,#e0a63a,#b8434f,#7a1f2b
            dist/snake-dark.svg?palette=github-dark&color_snake=#e0a63a&color_dots=#23211e,#3d2a22,#7a1f2b,#b8434f,#e0a63a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
